services:
  backend:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 55s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - learning-data:/data
    command: ["python", "-m", "backend.server", "--host", "0.0.0.0", "--port", "8080", "--public-origin", "${PUBLIC_ORIGIN:-http://localhost:8080}", "--data-dir", "/data", "--max-jobs", "4"]
volumes:
  learning-data:
